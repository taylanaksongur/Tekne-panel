name: AIS Worker yayınla
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ais-worker/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ais-worker
          secrets: |
            AIS_KEY
        env:
          AIS_KEY: ${{ secrets.AIS_KEY }}
